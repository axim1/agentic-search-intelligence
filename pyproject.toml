[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-search-intelligence"
version = "0.1.0"
description = "Production-minded LangGraph search intelligence assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "langgraph>=0.2,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/search_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
